name: Try the accessibility Action

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target-url:
        description: Public, non-sensitive page to audit
        required: true
        default: https://example.com/
      target-host:
        description: Expected hostname for the target URL
        required: true
        default: example.com

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: audit
        uses: ./
        with:
          urls: ${{ inputs.target-url }}
          allowed-hosts: ${{ inputs.target-host }}
          fail-on: none
          comment-on-pr: 'false'
      - name: Upload accessibility evidence
        if: always() && steps.audit.outputs.output-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-audit
          path: ${{ steps.audit.outputs.output-dir }}
          retention-days: 14
