name: Try the accessibility Action
run-name: Accessibility audit · ${{ inputs['request-id'] || 'manual run' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target-url:
        description: Public HTTPS pages to audit, one per line
        required: true
        default: https://example.com/
      request-id:
        description: Launcher request identifier
        required: false
        default: manual-run

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: audit
        uses: ./
        with:
          urls: ${{ inputs['target-url'] }}
          auditor: Carla / CarlasHub
          fail-on: none
          comment-on-pr: 'false'
      - name: Upload accessibility evidence
        id: evidence
        if: always() && steps.audit.outputs.output-dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accessibility-audit
          path: ${{ steps.audit.outputs.output-dir }}
          retention-days: 14
      - name: Add the report link to the run summary
        if: always() && steps.evidence.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          {
            echo '## Accessibility report ready'
            echo
            echo "[Download the complete report]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
