<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit fixture</title>
    <style>
      body { font-family: sans-serif; margin: 0; }
      header, main { padding: 1rem; }
      nav { display: flex; align-items: center; gap: 8px; }
      nav a, nav button, input, [role="tablist"] button { min-height: 24px; }
      nav a { min-width: 24px; }
      input { display: block; margin-block: 8px; }
      #menu[hidden] { display: none; }
      a:focus, button:focus, input:focus { outline: 3px solid #005fcc; outline-offset: 2px; }
      .target-cluster { display: flex; gap: 0; }
      .small { width: 18px; height: 18px; padding: 0; }
      #cookie-consent {
        position: fixed;
        inset: auto 1rem 1rem 1rem;
        z-index: 1000;
        padding: 1rem;
        color: white;
        background: rgba(0, 0, 0, 0.92);
      }
    </style>
  </head>
  <body>
    <div id="cookie-consent" role="dialog" aria-label="Cookie consent">
      <p>We use cookies to improve the site. Choose whether to accept optional cookies.</p>
      <button id="reject-cookies">Reject all</button>
      <button id="accept-cookies">Accept all</button>
    </div>
    <header>
      <nav aria-label="Primary">
        <a href="/"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="></a>
        <a id="meaningful-image-link" href="/about"><img alt="About us" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="></a>
        <a href="/missing">Missing destination</a>
        <div id="menu" hidden><a href="/jobs">Jobs</a></div>
        <button id="menu-toggle" aria-expanded="false" aria-controls="menu">Menu</button>
        <button aria-label="Search">Search</button>
      </nav>
    </header>
    <main>
      <h1>Fixture page</h1>
      <div class="target-cluster" role="group" aria-label="Card actions">
        <button class="small" aria-label="Save"></button>
        <button class="small" aria-label="Share"></button>
      </div>
      <input type="text">
      <label for="labelled-input">Labelled input</label>
      <input id="labelled-input" type="text">
      <p><a id="cookie-settings" href="#">Cookie Settings <img alt="Opens in a new window" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="></a></p>
      <div id="information-tabs" role="tablist" aria-label="Information">
        <button id="tab-first" role="tab" aria-selected="true" aria-controls="missing-panel">First</button>
        <button id="tab-second" role="tab" aria-selected="false" tabindex="-1">Second</button>
      </div>
    </main>
    <script>
      const toggle = document.querySelector('#menu-toggle');
      const menu = document.querySelector('#menu');
      const consent = document.querySelector('#cookie-consent');
      document.querySelector('#reject-cookies').addEventListener('click', () => { consent.hidden = true; });
      document.querySelector('#accept-cookies').addEventListener('click', () => { consent.hidden = true; });
      toggle.addEventListener('click', () => {
        const open = toggle.getAttribute('aria-expanded') !== 'true';
        toggle.setAttribute('aria-expanded', String(open));
        menu.hidden = !open;
      });
    </script>
  </body>
</html>
